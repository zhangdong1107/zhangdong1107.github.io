<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>访问统计检查</title><style>body{font:17px/1.8 sans-serif;max-width:700px;margin:45px auto;padding:20px;color:#18354a}#result{padding:20px;background:#eff4f1;white-space:pre-wrap}button{padding:12px;font-size:16px}</style></head><body><h1>访问统计检查</h1><p>此页仅用于排查，不自动发送访问记录。请把下方检查结果截图发给我。</p><pre id="result">正在加载统计脚本…</pre><button id="test" disabled>发送一条手机测试事件</button><p id="note"></p><a href="/">返回个人主页</a><script>window.goatcounter={no_onload:true};function loaded(){var reason=window.goatcounter.filter();document.getElementById('result').textContent='脚本：加载成功\n过滤原因：'+(reason||'未被过滤')+'\n浏览器：'+navigator.userAgent;document.getElementById('test').disabled=!!reason;}document.getElementById('test').onclick=function(){window.goatcounter.count({path:'mobile-diagnostic-test',title:'User-triggered mobile diagnostic test',event:true});document.getElementById('note').textContent='已调用统计发送，请稍后在后台寻找 mobile-diagnostic-test。此提示不代表后台已收到。';this.disabled=true;};</script><script data-goatcounter="https://zhangdong1107.goatcounter.com/count" src="/assets/goatcounter.js" onload="loaded()" onerror="document.getElementById('result').textContent='脚本加载失败'"></script></body></html>
